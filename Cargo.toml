[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

# Exact pins. Add new crates here, not in the member manifests.
[workspace.dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
ignore = "=0.4.33"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"

flyover-tiles = { path = "crates/flyover-tiles" }
flyover-index = { path = "crates/flyover-index" }
flyover-layout = { path = "crates/flyover-layout" }
flyover-render = { path = "crates/flyover-render" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
