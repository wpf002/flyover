[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

# Exact pins. Add new crates here, not in the member manifests.
[workspace.dependencies]
anyhow = "=1.0.104"
blake3 = "=1.8.7"
clap = { version = "=4.6.7", features = ["derive"] }
ignore = "=0.4.33"
rayon = "=1.12.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"

# tree-sitter core plus one grammar per M1 language. Grammars target a range of
# tree-sitter-language ABI versions; the shim decouples them from the core version.
tree-sitter = "=0.27.0"
tree-sitter-c = "=0.24.2"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-php = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
zstd = "=0.14.0"
# Pure-Rust zstd decoder: tile decode on every target, including wasm32 (the C zstd crate is
# native-only and used just for encoding in the layout stage).
ruzstd = "=0.9.0"

# Renderer (M3): wgpu native + winit window, glam math, offscreen PNG for headless checks.
wgpu = "=30.0.1"
winit = "=0.30.13"
pollster = "=1.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = { version = "=0.33.7", features = ["bytemuck"] }
png = "=0.18.1"

# Browser build (M5): wasm-bindgen glue for crates/flyover-web. Versions match what wgpu's
# WebGPU backend already locks, so there is one copy of each.
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = "=0.3.105"
console_error_panic_hook = "=0.1.7"

# Font rasterizer, used only by the offline atlas baker (crates/flyover-atlas).
fontdue = "=0.9.4"

flyover-tiles = { path = "crates/flyover-tiles" }
flyover-index = { path = "crates/flyover-index" }
flyover-layout = { path = "crates/flyover-layout" }
flyover-render = { path = "crates/flyover-render" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
